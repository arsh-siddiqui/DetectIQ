<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B132B" />
    <meta name="description" content="DetectIQ is a next-generation AI cybersecurity threat detection and forensic intelligence platform. Real-time scanning for URLs, phishing emails, SMS smishing, QR codes, and suspicious files." />
    <meta name="keywords" content="cybersecurity, threat detection, phishing detector, email security, URL scanner, QR code scanner, threat intelligence, SOC copilot, security analysis" />
    <meta name="author" content="DetectIQ Security Team" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://detectiq-api.onrender.com/" />
    <meta property="og:title" content="DetectIQ — Next-Gen Threat Detection & Forensics" />
    <meta property="og:description" content="Detect threats across URLs, emails, SMS, QR codes, and files. Explain evidence in real-time with our zero-trust intelligence pipeline." />
    <meta property="og:site_name" content="DetectIQ" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DetectIQ — Next-Gen Threat Detection & Forensics" />
    <meta name="twitter:description" content="Detect threats across URLs, emails, SMS, QR codes, and files with transparent evidence." />

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>DetectIQ — Learn Smart. Detect Fast. Stay Safe.</title>
    <!-- Add Inter and Outfit fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
