<svg width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="diq-outer-d" x1="20" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <linearGradient id="diq-fold" x1="25" y1="50" x2="60" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="diq-lens-rim" x1="38" y1="38" x2="66" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <radialGradient id="diq-lens-glass" cx="48" cy="48" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <linearGradient id="diq-handle" x1="60" y1="60" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <!-- Background Dark Rounded Square for Contrast in browser tabs -->
  <rect width="100" height="100" rx="22" fill="#0A0F1D" />

  <!-- Telemetry Pixel Cubes on Left -->
  <rect x="12" y="16" width="7" height="7" rx="1.5" fill="#6366F1" />
  <rect x="4" y="32" width="6.5" height="6.5" rx="1.5" fill="#00F0FF" />
  <rect x="11" y="40" width="8" height="8" rx="1.5" fill="#3B82F6" />
  <rect x="6" y="51" width="6" height="6" rx="1.5" fill="#0284C7" />
  <rect x="13" y="62" width="7.5" height="7.5" rx="1.5" fill="#38BDF8" />

  <!-- Main Stylized 'D' Outer Arc -->
  <path d="M28 14 C50 14, 88 18, 88 48 C88 76, 54 84, 30 84 L30 68 C44 68, 70 64, 70 48 C70 30, 46 28, 28 28 Z" fill="url(#diq-outer-d)" />

  <!-- Lower Inner Fold / Spine of D -->
  <path d="M28 28 L28 84 L44 84 L44 72 L40 68 L40 36 L28 28 Z" fill="url(#diq-fold)" />

  <!-- Magnifying Glass Handle (forms the tail of Q) -->
  <path d="M62 62 L80 80 L85 75 L67 57 Z" fill="url(#diq-handle)" />
  <circle cx="81" cy="78" r="2.5" fill="#FFFFFF" />

  <!-- Magnifying Lens Outer Rim -->
  <circle cx="54" cy="52" r="16" fill="url(#diq-lens-glass)" stroke="url(#diq-lens-rim)" stroke-width="3.5" />

  <!-- Center Iris / Pupil -->
  <circle cx="54" cy="52" r="8" fill="#0284C7" />
  <circle cx="54" cy="52" r="5" fill="#0369A1" />

  <!-- Glossy Spherical Highlight Glare -->
  <ellipse cx="50" cy="47" rx="4" ry="2.5" transform="rotate(-30 50 47)" fill="#FFFFFF" fill-opacity="0.85" />
  <circle cx="58" cy="55" r="1.5" fill="#FFFFFF" fill-opacity="0.5" />
</svg>